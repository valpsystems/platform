<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0A0A1A; color: #F8FAFC; padding: 40px;">
<div style="max-width: 600px; margin: 0 auto; background: #0D0D2B; border: 1px solid #1A1A3E; border-radius: 12px; padding: 40px;">
<div style="text-align: center; margin-bottom: 30px;">
<h1 style="color: #0066FF; font-size: 24px; margin: 0;">{{ company_name }}</h1>
</div>
<h2 style="color: #F8FAFC; font-size: 20px; margin-bottom: 20px;">New Quote Request</h2>
<table style="width: 100%; border-collapse: collapse;">
<tr><td style="padding: 10px 0; color: #6B7280;">Service</td><td style="padding: 10px 0; color: #F8FAFC;">{{ service }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Name</td><td style="padding: 10px 0; color: #F8FAFC;">{{ name }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Email</td><td style="padding: 10px 0; color: #F8FAFC;">{{ email }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Company</td><td style="padding: 10px 0; color: #F8FAFC;">{{ company }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Phone</td><td style="padding: 10px 0; color: #F8FAFC;">{{ phone }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Budget Range</td><td style="padding: 10px 0; color: #F8FAFC;">{{ budget_range }}</td></tr>
<tr><td style="padding: 10px 0; color: #6B7280;">Timeline</td><td style="padding: 10px 0; color: #F8FAFC;">{{ timeline }}</td></tr>
</table>
<h3 style="color: #F8FAFC; margin-top: 30px;">Project Description</h3>
<p style="color: #6B7280; line-height: 1.6;">{{ project_description }}</p>
</div>
</body>
</html>
